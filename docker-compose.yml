services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'
      # eval listener, see mosquitto/mosquitto.conf
      - '127.0.0.1:1884:1884'
    volumes:
      - ./mosquitto:/mosquitto/config:ro

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
