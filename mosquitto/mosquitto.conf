
# Local development only. Anonymous access, never deploy this config.

listener 1883

# Eval runner and its api only (spec 03). mount_point prefixes every topic from
# this listener with eval/, so eval traffic never matches the dev api's
# devices/+/... subscriptions on 1883, including its persistent session while
# it's down.
listener 1884
mount_point eval/

allow_anonymous true

